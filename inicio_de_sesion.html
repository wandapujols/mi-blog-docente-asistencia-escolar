<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAsiste - Autenticación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">EduAsiste</h1>
            <p class="text-sm text-slate-500">Gestión Escolar Inteligente</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                <input id="emailInput" type="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="correo@colegio.edu.do">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input id="passInput" type="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition-all">
                Ingresar al Sistema
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Acceso Rápido Demo</p>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="loginDemo('docente@eduasiste.edu.do', 'Demodocente2026*')" class="p-3 border rounded-lg hover:bg-slate-50 text-left transition-all">
                    <div class="font-medium text-sm text-slate-800">Docente Demo</div>
                    <div class="text-xs text-slate-500">Prof. M. Flores</div>
                </button>
                <button type="button" onclick="loginDemo('direccion@eduasiste.edu.do', 'Demodocente2026*')" class="p-3 border rounded-lg hover:bg-slate-50 text-left transition-all">
                    <div class="font-medium text-sm text-slate-800">Directivo Demo</div>
                    <div class="text-xs text-slate-500">Dirección Académica</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passInput').value;
            await ejecutarLogin(email, password);
        }

        async function loginDemo(email, password) {
            await ejecutarLogin(email, password);
        }

        async function ejecutarLogin(email, password) {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = data.user.role === 'admin' ? 'dashboard_admin.html' : 'dashboard.html';
                } else {
                    alert(data.error || 'Credenciales incorrectas');
                }
            } catch (err) {
                console.error('Error:', err);
                alert('No se pudo conectar con el servidor');
            }
        }
    </script>
</body>
</html>
