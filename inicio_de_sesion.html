<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAsiste - Autenticación</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">EduAsiste</h1>
            <p class="text-sm text-slate-500">Gestión Escolar Inteligente</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                <input id="emailInput" type="email" required class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" value="docente@eduasiste.edu.do">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input id="passInput" type="password" required class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" value="12345678">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition-all">
                Ingresar al Sistema
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Acceso Rápido</p>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="loginDirecto('docente@eduasiste.edu.do', 'teacher')" class="p-3 border rounded-lg hover:bg-slate-50 text-left transition-all">
                    <div class="font-medium text-sm text-slate-800">Docente Demo</div>
                    <div class="text-xs text-slate-500">Entrar Directo</div>
                </button>
                <button type="button" onclick="loginDirecto('direccion@eduasiste.edu.do', 'admin')" class="p-3 border rounded-lg hover:bg-slate-50 text-left transition-all">
                    <div class="font-medium text-sm text-slate-800">Directivo Demo</div>
                    <div class="text-xs text-slate-500">Entrar Directo</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value;
            loginDirecto(email, email.includes('dir') ? 'admin' : 'teacher');
        }

        function loginDirecto(email, role) {
            localStorage.setItem('token', 'demo-token-libre');
            localStorage.setItem('user', JSON.stringify({ email: email, name: role === 'admin' ? 'Dirección Académica' : 'Prof. Carmen Mendoza', role: role }));
            window.location.href = role === 'admin' ? 'dashboard_admin.html' : 'dashboard.html';
        }
    </script>
</body>
</html>
